name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Run Playwright E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eventhub_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/eventhub_ci
      PORT: 3001
      JWT_SECRET: eventhub-playwright-ci-only-secret
      CORS_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      E2E_TEST_EMAIL: rahulshetty1@gmail.com
      E2E_TEST_PASSWORD: Magiclife1!
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Prepare isolated CI database
        run: |
          npx prisma generate
          npx prisma migrate deploy
        working-directory: backend

      - name: Seed CI test data
        run: npm run seed --prefix backend

      - name: Start backend
        run: |
          npm run start --prefix backend > "$RUNNER_TEMP/eventhub-backend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/eventhub-backend.log"
          echo "::error::Backend did not become healthy"
          exit 1

      - name: Start frontend
        run: |
          npm run dev --prefix frontend -- --hostname 127.0.0.1 > "$RUNNER_TEMP/eventhub-frontend.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/eventhub-frontend.log"
          echo "::error::Frontend did not become ready"
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
